name: aside-browser
version: 0.3.0
description: Use the signed-in Aside browser as Hermes's browser when the Aside CLI is installed.
author: Leon Phull
license: MIT
kind: standalone
requires_hermes: ">=0.21.0"
provides_tools:
  - aside_status
  - aside_exec
  - aside_repl
  - aside_session
  - aside_memory
provides_hooks:
  - pre_tool_call
config_schema:
  model_pin:
    type: string
    default: ""
    description: "Pinned Aside model as provider/model. Empty uses Aside's own default."
  host:
    type: string
    default: ""
    description: "Aside session host. Empty means the local machine."
  account:
    type: string
    default: ""
    description: "Aside account id, such as u0. Empty uses Aside's current account."
  effort:
    type: string
    default: ""
    description: "Thinking effort. Empty uses Aside's own default."
  speed:
    type: string
    default: ""
    description: "Model speed, default or fast. Empty uses Aside's own default."
  permission:
    type: string
    default: "ask"
    enum: [ask, guard, full-access]
    description: "User-controlled via `hermes aside permission`; never a tool argument."
  browser_policy:
    type: string
    default: "prefer"
    description: "prefer lets the agent choose. always blocks the built-in browser while Aside is READY."
